id: bucket-sensitive-web-paths-java
name: Sensitive Web Paths - Java
platform: logsign
object_type: static_bucket

author: SOC
date: 2026-10-16
modified: 2026-10-16

status: draft

definition:
  description: >
    URL path patterns that expose Java-stack admin consoles, management
    endpoints, and Spring Boot Actuator endpoints. A successful (2xx)
    response indicates real exposure. Only reference this bucket in a
    tenant's alert if that tenant runs a Java/Spring/Tomcat stack.
    Referenced by the Sensitive Web Path Returned Success detection.
  type: static
  group: behavior
  severity: major
  roles:
    - CMC_Monitor_Role

data:
  match_type: contains_any
  key:
    - /manager/html
    - /host-manager/html
    - /jmx-console
    - /web-console
    - /invoker/jmxinvokerservlet
    - /h2-console
    - /solr/admin
    - /solr/#/
    - /actuator/env
    - /actuator/heapdump
    - /actuator/threaddump
    - /actuator/configprops
    - /actuator/mappings
    - /actuator/beans
    - /actuator/httptrace
    - /actuator/loggers
    - /actuator/jolokia
    - /console/login/loginform.jsp

  values:
    - true

usage:
  detection:
    - Sensitive Web Path Returned Success

modifier:
  key_field:
    - URL.Path
  modify_field:
    - URL.SensitivePathHit
  value:
    - java
  buckets: null

  purpose: >
    Stamp requests whose path matches a known Java-stack sensitive pattern
    so the alert can fire when the response code also indicates success.

tuning_notes:
  - /actuator/health and /actuator/info are often intentionally public; they are deliberately EXCLUDED here. Only the information-disclosure actuators are listed.
  - /actuator/heapdump returning 2xx is high severity - a heap dump commonly contains credentials and tokens. Prioritise its triage.
  - /actuator/* is listed as explicit sub-paths rather than a wildcard, because contains_any has no glob. Add new actuator paths as Spring Boot versions introduce them.
  - Only reference this bucket for tenants actually running Java/Spring/Tomcat. Do not attach it to pure-PHP tenants.

owner: SOC

validation:
  status: pending
  last_validated: null
  notes: null
