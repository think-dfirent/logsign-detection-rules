    URL.ResultCode:[200 TO 299] AND NOT URL.Path:("/static/js/" OR "/static/css/" OR "/static/media/" OR "/_next/static/" OR "/favicon.ico" OR "/manifest.json" OR "/robots.txt" OR "/vnpt-plugin.js" OR "/vntic-sign/tokensigning.js" OR "/deviceInfo-library/getDeviceInfo.js") AND @@WebServerEvents
  time_column: null
  group_column: Source.IP
  value_column: Source.IP
  criteria: value_count

  trigger:
    operator: ">"
    level: 360

  check_events_in_last_seconds: 180
  update_period_seconds: 60
  purge_period_seconds: 360

