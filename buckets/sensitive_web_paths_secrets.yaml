id: bucket-sensitive-web-paths-secrets
name: Sensitive Web Paths - Secrets
platform: logsign
object_type: static_bucket

author: SOC
date: 2026-10-16
modified: 2026-10-16

status: draft

definition:
  description: >
    URL path patterns for exposed secrets, credentials, and version-control
    or config files. Stack-agnostic: any web server can leak these. A
    successful (2xx) response is a high-severity exposure (credential
    disclosure / source-code leak). Referenced by the Sensitive Web Path
    Returned Success detection.
  type: static
  group: behavior
  severity: major
  roles:
    - CMC_Monitor_Role

data:
  match_type: contains_any
  key:
    - /.env
    - /.git/config
    - /.git/head
    - /.git/HEAD
    - /.svn/entries
    - /.aws/credentials
    - /.ssh/id_rsa
    - /.htpasswd
    - /.ds_store
    - /.DS_Store
    - web.config
    - /credentials.xml
    - /secrets.yaml
    - /secrets.yml

  values:
    - true

usage:
  detection:
    - Sensitive Web Path Returned Success

modifier:
  key_field:
    - URL.Path
  modify_field:
    - URL.SensitivePathHit
  value:
    - $value
  buckets: null

  purpose: >
    Stamp requests whose path matches a known secret/credential/VCS file
    so the alert can fire when the response code indicates the file was
    actually served.

tuning_notes:
  - A 2xx hit here warrants a credential rotation ticket even if the source turns out to be a benign scanner, because exposure is confirmed regardless of intent.
  - This list is stack-agnostic; keep it unified rather than splitting by PHP/Java/.NET.
  - Confirm match runs on a decoded, lowercased URL.Path - /.env is trivially bypassed as /%2eenv or /.ENV otherwise.
  - Consider a separate higher-severity alert instance for this bucket vs the PHP/debug buckets.

owner: SOC

validation:
  status: pending
  last_validated: null
  notes: null
