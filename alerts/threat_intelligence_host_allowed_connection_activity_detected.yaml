id: alert-threat-intelligence_host_allowed_connection_activity_detected

name: Threat Intelligence Host Allowed Connection Activity Detected
platform: logsign
object_type: alert_rule

author: SOC
date: 2026-09-28
modified: 2026-10-13

status: production

definition:
  description: Threat Intelligence Host Allowed Connection Activity Detected excluding ICMP
  category: malware
  severity: critical
  tags:
    - TI
    - malware-ip
  roles:
    - CMC_Monitor_Role

depends_on:
  - bucket-threat-intelligence_ips

conditions:
  - field: Source.IP
    operator: BEHAVIOR
    value: Threat Intelligence IPs

  - field: EventMap.Type
    operator: IS
    value: Session

  - field: EventMap.SubType
    operator: IS
    value: Allow

  - field: Bytes.Received
    operator: GREATER
    value: 0

  - field: Protocol.Name
    operator: IS NOT
    value: ICMP

suppression:
  duration_seconds: 600
  columns:
    - Source.IP

run: always

action:
  column: Source.IP
  rules:
    - CMC Telecom Alert
  overwrite_info: false

soar_connector: Alert Engine
managed_security: ticket

owner: SOC

validation:
  status: pending
  last_validated: null
  notes: null
