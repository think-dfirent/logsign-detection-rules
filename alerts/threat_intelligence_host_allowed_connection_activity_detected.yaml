id: alert-accept-connection-from-known-malware-ip

name: Accept Connection from Known Malware IP
platform: logsign
object_type: alert_rule

author: SOC
date: 2026-09-28
modified: 2026-09-28

status: draft

definition:
  description: Accept Connection from Known Malware IP
  category: malware
  severity: critical
  tags:
    - TI
    - malware-ip
  roles:
    - CMC_Monitor_Role

depends_on:
  - bucket-malware-hosts-reported-by-threat-intelligence-source

conditions:
  - field: Source.IP
    operator: BEHAVIOR
    value: Malware Hosts Reported by Threat Intelligence Source

  - field: Source.Position
    operator: IS
    value: out

  - field: Destination.Position
    operator: IS
    value: in

  - field: Event.Action
    operator: IS
    value: accept

suppression:
  duration_seconds: 600
  columns:
    - Source.IP

run: always

action:
  column: Source.IP
  rules:
    - CMC Telecom Alert
  overwrite_info: false

soar_connector: Alert Engine
managed_security: ticket

owner: SOC

validation:
  status: pending
  last_validated: null
  notes: null
