id: alert-internal-to-internal-excessive-denied

name: Internal-to-Internal Excessive Denied Connection
platform: logsign
object_type: alert_rule


author: SOC
date: 2026-09-28
modified: 2026-10-08

status: production

definition:
  description: >
    Alerts when an internal source that has entered the excessive
    denied-connection bucket.
  category: traffic
  severity: warning

depends_on:
  - bucket-internal-to-internal-excessive-denied
  
conditions:
  - field: Bucket.Name
    operator: IS
    value: Internal-to-Internal Excessive Denied Connection

  - field: EventMap.SubType
    operator: IS
    value: Set

  - field: DataType
    operator: IS
    value: bucket


suppression:
  duration_seconds: 360
  columns:
    - Source.IP

action:
  column: Source.IP

managed_security: ticket

owner: SOC

validation:
  status: pending
  last_validated: null
  notes: null