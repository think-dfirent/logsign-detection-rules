id: alert-sensitive-web-path-returned-success

name: Sensitive Web Path Returned Success
platform: logsign
object_type: alert_rule

author: SOC
date: 2026-10-16
modified: 2026-10-16

status: draft

definition:
  description: >
    Fires when a request for a known sensitive web path (admin panel,
    secret/config file, debug endpoint, or backup/dump extension) returns
    a successful response (HTTP 2xx), indicating real exposure rather than
    a failed probe. The response-code condition is what separates this from
    ordinary internet scanning noise.
  category: Web
  severity: warning
  roles:
    - CMC_Monitor_Role

depends_on:
  - bucket-sensitive-web-paths-php
  - bucket-sensitive-web-paths-secrets
  - bucket-sensitive-web-paths-backup-ext
  - bucket-sensitive-web-paths-java
  - bucket-sensitive-web-paths-dotnet

conditions:
  - field: Source.IP
    operator: BEHAVIOR
    value: 
      - bucket-sensitive-web-paths-php
      - bucket-sensitive-web-paths-secrets
      - bucket-sensitive-web-paths-backup-ext
      - bucket-sensitive-web-paths-java
      - bucket-sensitive-web-paths-dotnet  

  - field: URL.ResultCode
    operator: IN
    value:
      - 200
      - 206

  # Only inbound traffic to our monitored web assets.
  - field: Source.Position
    operator: IS
    value: out

suppression:
  duration_seconds: 600
  columns:
    - Source.IP
    - Destination.IP
    - URL.Path

run: always

action:
  column: Source.IP
  rules:
    - CMC Telecom Alert
  overwrite_info: false

soar_connector: Alert Engine
managed_security: ticket

detection_hypothesis: >
  A sensitive web path returning HTTP 2xx means the admin panel, secret
  file, debug endpoint, or backup is reachable and served content. This is
  a confirmed exposure (vulnerability finding) regardless of whether the
  requester is a targeted attacker or an untargeted scanner.

false_positives:
  - Internal vulnerability scanners (Nessus/Qualys/Acunetix) - exclude by source IP, never by User-Agent.
  - Monitoring hitting /server-status, /nginx_status, health endpoints - exclude by source+destination+path together.
  - Applications returning HTTP 200 for non-existent paths (soft 404) - verify per destination, exclude narrowly.
  - Authorized admin use of DB panels from internal/VPN ranges - and note these panels should not be internet-reachable.
  - Download/release portals serving .zip/.tar.gz legitimately - scope out that destination for the backup-ext bucket only.

evasion_notes:
  - Case variation (/PHPINFO.php) and URL-encoding (/%70hpinfo.php) bypass the match if URL.Path is not decoded and lowercased before bucket evaluation. Fix at the parser, not by expanding the list.
  - Soft-404 apps returning 200 can mask real vs fake; pair with response size where available.

# Wordlist path request = Active Scanning (TA0043). Map T1190/T1552 only after
# follow-up evidence (panel login POST, reuse of leaked .env values).
mitre_attack:
  - T1595.003

triage:
  - Compare response size against the site's normal 404 page to judge whether content was really served.
  - Pivot on Source.IP: look for POSTs to the panel, follow-up use of leaked values, access to other hosts.
  - Identify the asset owner; if genuinely exposed, raise a vuln ticket and (for secrets) a credential rotation.

owner: SOC

validation:
  status: pending
  last_validated: null
  notes: >
    Blocked on confirming: (1) URL.ResultCode field name and numeric vs
    string type, (2) contains_any/ends_with case + decode behavior,
    (3) whether one rule runs across all tenants (scope by Destination.Domain)
    or one rule instance per tenant.
